        <path d="M30 42C30 40.3431 31.3431 39 33 39H66C67.6569 39 69 40.3431 69 42V45.5C69 46.8 68.2 47.9 67 48.4L47.5 73.5C46.5 74.8 44.5 75 43.1 74C41.8 73 41.5 71 42.6 69.7L57.5 50.5H33C31.3431 50.5 30 49.1569 30 47.5V42Z" fill="url(#sevenGradDark)"/>

