<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" fill="none">
    <defs>
        <linearGradient id="roofGradDark" x1="15" y1="10" x2="85" y2="70" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#BAE6FD"/>
        </linearGradient>
        <linearGradient id="sevenGradDark" x1="25" y1="35" x2="65" y2="75" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="40%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        <linearGradient id="swooshGradDark" x1="5" y1="75" x2="95" y2="50" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#E0F2FE"/>
            <stop offset="50%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.35"/>
        </filter>
    </defs>

    <g filter="url(#glow)">
