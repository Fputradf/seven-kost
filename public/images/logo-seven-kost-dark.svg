        <!-- 4 Window Dots -->
        <rect x="44.5" y="27" width="4.5" height="4.5" rx="1.5" fill="#38BDF8"/>
        <rect x="51" y="27" width="4.5" height="4.5" rx="1.5" fill="#38BDF8"/>
        <rect x="44.5" y="33.5" width="4.5" height="4.5" rx="1.5" fill="#38BDF8"/>
        <rect x="51" y="33.5" width="4.5" height="4.5" rx="1.5" fill="#38BDF8"/>

